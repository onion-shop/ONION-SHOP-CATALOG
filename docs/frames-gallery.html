<title>Рамки для аватара</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&family=Unbounded:wght@600;800&display=swap">
<style>
/* Композиция: липкая панель управления сверху, сетка карточек с рамками, липкая панель выбора снизу.
   Палитра: холодный сине-серый фон под бренд магазина, акцент бирюзово-синий. */
:root{
  --bg:#eef2f8; --card:#ffffff; --fg:#14213d; --mute:#5b6b86; --line:#d9e1ee;
  --accent:#1470c0; --accent-2:#2fb4e0; --chip:#e3eaf5; --chip-on:#14213d; --chip-on-fg:#ffffff;
  --stage-light:#e8eef8; --stage-dark:#0f1828; --stage-brand:#1470c0;
  --sel:#ff6b3d;
  --f-d:'Unbounded','Onest',system-ui,sans-serif; --f-b:'Onest',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1220; --card:#131d31; --fg:#e8eefb; --mute:#97a6c2; --line:#233250;
  --accent:#4cb3ff; --accent-2:#7fe0ff; --chip:#1a2742; --chip-on:#e8eefb; --chip-on-fg:#0b1220;
  --stage-light:#d9e3f5; --stage-dark:#0a111f; --stage-brand:#1470c0; --sel:#ff8a5c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1220; --card:#131d31; --fg:#e8eefb; --mute:#97a6c2; --line:#233250;
  --accent:#4cb3ff; --accent-2:#7fe0ff; --chip:#1a2742; --chip-on:#e8eefb; --chip-on-fg:#0b1220;
  --stage-light:#d9e3f5; --stage-dark:#0a111f; --stage-brand:#1470c0; --sel:#ff8a5c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-b);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px;font-size:15px;line-height:1.4}
.wrap{max-width:1240px;margin:0 auto}
h1{font:800 clamp(1.5rem,4.4vw,2.3rem)/1.1 var(--f-d);margin:0 0 8px;text-wrap:balance;letter-spacing:-.01em}
.lead{max-width:62ch;color:var(--mute);margin:0 0 18px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 12px;display:grid;gap:10px;border-bottom:1px solid var(--line);margin-bottom:18px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:0;background:var(--chip);color:var(--fg);font:500 13.5px var(--f-b);padding:8px 13px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-fg)}
.chip small{opacity:.6;margin-left:4px}
.lbl{font:700 11px var(--f-b);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-right:2px}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--fg);font:500 13px var(--f-b);padding:6px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--sz,150px),1fr));gap:12px}
.card{position:relative;background:var(--card);border:2px solid transparent;border-radius:18px;padding:0 0 12px;text-align:center;cursor:pointer;font:inherit;color:inherit;min-width:0;display:grid;grid-template-rows:auto auto auto;align-content:start;box-shadow:0 1px 0 var(--line)}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card[aria-pressed="true"]{border-color:var(--sel);box-shadow:0 0 0 3px color-mix(in srgb,var(--sel) 22%,transparent)}
.stage{border-radius:16px 16px 12px 12px;aspect-ratio:1;display:grid;place-items:center;overflow:hidden;margin:4px}
.grid[data-bg="light"] .stage{background:var(--stage-light)}
.grid[data-bg="dark"] .stage{background:radial-gradient(circle at 50% 40%,#1a2a47,var(--stage-dark))}
.grid[data-bg="brand"] .stage{background:linear-gradient(160deg,#2fb4e0,var(--stage-brand) 60%,#0d3f78)}
.stage svg{width:100%;height:100%;display:block}
.no{position:absolute;left:12px;top:12px;font:800 12px var(--f-d);background:var(--fg);color:var(--bg);border-radius:8px;padding:3px 7px;z-index:1}
.star{position:absolute;right:12px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--card);display:grid;place-items:center;z-index:1;font-size:15px;color:var(--mute);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.card[aria-pressed="true"] .star{background:var(--sel);color:#fff}
.nm{font:700 14px var(--f-b);padding:2px 10px 0;text-wrap:balance}
.ds{font-size:12.5px;color:var(--mute);padding:2px 10px 0;text-wrap:balance}
.pick{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -8px 24px rgba(10,20,40,.12)}
.pick .in{max-width:1240px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pick .list{flex:1 1 260px;min-width:0;font-size:13.5px;color:var(--mute);max-height:3.2em;overflow:auto}
.pick b{color:var(--fg)}
.btn{border:0;border-radius:12px;font:700 14px var(--f-b);padding:11px 16px;cursor:pointer}
.btn.pri{background:var(--accent);color:#fff}
.btn.sec{background:var(--chip);color:var(--fg)}
.btn:disabled{opacity:.45;cursor:default}
.toast{font-size:13px;color:var(--accent)}
/* анимации рамок */
svg .spin,svg .spinr,svg .pulse,svg .tw,svg .flick,svg .wob{transform-box:view-box;transform-origin:50% 50%}
.spin{animation:spin 14s linear infinite}.spinr{animation:spin 18s linear infinite reverse}
.spin2{animation:spin 6s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.tw{animation:tw 2.2s ease-in-out infinite}.tw2{animation:tw 2.2s ease-in-out -1.1s infinite}
.flick{animation:flick .9s ease-in-out infinite alternate}.flick2{animation:flick .7s ease-in-out -.3s infinite alternate}
.wob{animation:wob 5s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
@keyframes flick{from{opacity:.55}to{opacity:1}}
@keyframes wob{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.noanim svg *{animation:none!important}
@media (prefers-reduced-motion:reduce){svg *{animation:none!important}}
</style>
<div class="wrap">
  <h1>Рамки для аватара: 105 вариантов</h1>
  <p class="lead">Нажмите на рамку, чтобы отметить её звёздочкой. Внизу появится список, который можно скопировать и отправить в ответ. Можно переключать фон под аватаром и включать или выключать движение.</p>
  <div class="bar">
    <div class="row" id="chips"></div>
    <div class="row">
      <span class="lbl">Фон</span><span class="seg" id="bgseg"><button data-v="light" aria-pressed="true">Светлый</button><button data-v="dark" aria-pressed="false">Тёмный</button><button data-v="brand" aria-pressed="false">Синий</button></span>
      <span class="lbl">Размер</span><span class="seg" id="szseg"><button data-v="110" aria-pressed="false">S</button><button data-v="150" aria-pressed="true">M</button><button data-v="210" aria-pressed="false">L</button></span>
      <span class="lbl">Движение</span><span class="seg" id="anseg"><button data-v="on" aria-pressed="true">Вкл</button><button data-v="off" aria-pressed="false">Выкл</button></span>
    </div>
  </div>
  <div class="grid" id="grid" data-bg="light"></div>
</div>
<div class="pick"><div class="in">
  <div class="list" id="plist"><b>Выбрано: 0</b></div>
  <span class="toast" id="toast" role="status"></span>
  <button class="btn sec" id="clr" disabled>Сбросить</button>
  <button class="btn pri" id="cpy" disabled>Скопировать список</button>
</div></div>
<script>
(function(){
var T=Math.PI*2,C=60;
function P(a,r){return[C+r*Math.cos(a),C+r*Math.sin(a)]}
function f2(n){return Math.round(n*10)/10}
function hx(h){h=h.replace('#','');if(h.length==3)h=h.split('').map(function(c){return c+c}).join('');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function toHex(r,g,b){return'#'+[r,g,b].map(function(v){return Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')}).join('')}
function mixc(a,b,t){var A=hx(a),B=hx(b);return toHex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t)}
function shade(c,k){return k>=0?mixc(c,'#ffffff',k):mixc(c,'#000000',-k)}
function hsl(h,s,l){s/=100;l/=100;var k=function(n){return(n+h/30)%12},a=s*Math.min(l,1-l),f=function(n){return l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)))};return toHex(f(0)*255,f(8)*255,f(4)*255)}
function rnd(seed){return function(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646}}
function colAt(cols,t){var n=cols.length,p=(((t%1)+1)%1)*n,i=Math.floor(p);return mixc(cols[i%n],cols[(i+1)%n],p-i)}
function arc(r,a0,a1){var p0=P(a0,r),p1=P(a1,r),large=(a1-a0)%T>Math.PI?1:0;return'M'+f2(p0[0])+' '+f2(p0[1])+'A'+r+' '+r+' 0 '+large+' 1 '+f2(p1[0])+' '+f2(p1[1])}
function conic(cols,r,w,seg,off){seg=seg||90;off=off==null?-Math.PI/2:off;var s='';for(var i=0;i<seg;i++){var a0=off+i*T/seg,a1=off+(i+1)*T/seg+.02;s+='<path d="'+arc(r,a0,a1)+'" fill="none" stroke="'+colAt(cols,(i+.5)/seg)+'" stroke-width="'+w+'"/>'}return s}
function conicSeg(cols,n,r,w,off){off=off==null?-Math.PI/2:off;var s='';for(var i=0;i<n;i++){s+='<path d="'+arc(r,off+i*T/n,off+(i+1)*T/n+.012)+'" fill="none" stroke="'+cols[i%cols.length]+'" stroke-width="'+w+'"/>'}return s}
function diag(n,r,w,cols,tilt){var s='';for(var i=0;i<n;i++){var a=-Math.PI/2+i*T/n,d=T/n,p=[P(a,r-w/2),P(a+d,r-w/2),P(a+d+tilt,r+w/2),P(a+tilt,r+w/2)];s+='<polygon points="'+p.map(function(q){return f2(q[0])+','+f2(q[1])}).join(' ')+'" fill="'+cols[i%cols.length]+'"/>'}return s}
function ring(r,w,stroke,ex){return'<circle cx="60" cy="60" r="'+r+'" fill="none" stroke="'+stroke+'" stroke-width="'+w+'" '+(ex||'')+'/>'}
function dot(x,y,r,fill,ex){return'<circle cx="'+f2(x)+'" cy="'+f2(y)+'" r="'+r+'" fill="'+fill+'" '+(ex||'')+'/>'}
function star(x,y,r,fill,rot,ex){rot=rot==null?-Math.PI/2:rot;var p=[];for(var i=0;i<10;i++){var a=rot+i*Math.PI/5,rr=i%2?r*.45:r;p.push(f2(x+rr*Math.cos(a))+','+f2(y+rr*Math.sin(a)))}return'<polygon points="'+p.join(' ')+'" fill="'+fill+'" '+(ex||'')+'/>'}
function spark(x,y,r,fill,ex){x=f2(x);y=f2(y);return'<path d="M'+x+' '+(y-r)+'Q'+x+' '+y+' '+(x+r)+' '+y+'Q'+x+' '+y+' '+x+' '+(y+r)+'Q'+x+' '+y+' '+(x-r)+' '+y+'Q'+x+' '+y+' '+x+' '+(y-r)+'Z" fill="'+fill+'" '+(ex||'')+'/>'}
function heart(x,y,s,fill,rot,ex){return'<path transform="translate('+f2(x)+' '+f2(y)+') rotate('+(rot||0)+') scale('+s+')" d="M0 .55C-1 -.1 -.7 -.9 0 -.4C.7 -.9 1 -.1 0 .55Z" fill="'+fill+'" '+(ex||'')+'/>'}
function leaf(x,y,ang,len,fill,ex){return'<path transform="translate('+f2(x)+' '+f2(y)+') rotate('+f2(ang*180/Math.PI)+')" d="M0 0Q'+len*.5+' '+(-len*.38)+' '+len+' 0Q'+len*.5+' '+len*.38+' 0 0Z" fill="'+fill+'" '+(ex||'')+'/>'}
function cube(x,y,s,c){var h=s*.87;return'<polygon points="'+[x,y-s,x+h,y-s/2,x,y,x-h,y-s/2].map(f2).join(',')+'" fill="'+c[0]+'"/><polygon points="'+[x-h,y-s/2,x,y,x,y+s,x-h,y+s/2].map(f2).join(',')+'" fill="'+c[1]+'"/><polygon points="'+[x,y,x+h,y-s/2,x+h,y+s/2,x,y+s].map(f2).join(',')+'" fill="'+c[2]+'"/>'}
function flower(x,y,r,n,pc,cc,rot){var s='<g transform="translate('+f2(x)+' '+f2(y)+') rotate('+(rot||0)+')">';for(var i=0;i<n;i++)s+='<ellipse cx="'+f2(r*.55)+'" cy="0" rx="'+f2(r*.5)+'" ry="'+f2(r*(n>8?.17:.27))+'" fill="'+pc+'" transform="rotate('+f2(i*360/n)+')"/>';return s+'<circle r="'+f2(r*.3)+'" fill="'+cc+'"/></g>'}
function rose(x,y,s,c){c=c||'#ee4a74';return'<g transform="translate('+f2(x)+' '+f2(y)+') scale('+s+')"><circle r="1" fill="'+shade(c,-.35)+'"/><path d="M-.8 .1Q-.6 -.9 .2 -.85Q.95 -.6 .7 .1Q.5 .85 -.2 .8Q-.9 .7 -.8 .1Z" fill="'+c+'"/><circle r=".55" fill="'+shade(c,.25)+'"/><path d="M-.3 0Q-.2 -.35 .1 -.3Q.4 -.2 .25 .1Q.1 .3 -.15 .2" fill="none" stroke="'+shade(c,-.45)+'" stroke-width=".11"/><circle r=".15" fill="'+shade(c,-.5)+'"/></g>'}
function gearPath(cx,cy,ri,ro,n,tw){var d='';for(var i=0;i<n;i++){var a=i*T/n,h=tw*T/n/2,q=T/n;var pts=[[a-q*.5+.0,ri],[a-h,ri],[a-h*.7,ro],[a+h*.7,ro],[a+h,ri],[a+q*.5,ri]];pts.forEach(function(p,j){var X=cx+p[1]*Math.cos(p[0]),Y=cy+p[1]*Math.sin(p[0]);d+=(i===0&&j===0?'M':'L')+f2(X)+' '+f2(Y)})}return d+'Z'}
function bandPath(ro,ri){return'M60 '+(60-ro)+'A'+ro+' '+ro+' 0 1 1 60 '+(60+ro)+'A'+ro+' '+ro+' 0 1 1 60 '+(60-ro)+'ZM60 '+(60-ri)+'A'+ri+' '+ri+' 0 1 0 60 '+(60+ri)+'A'+ri+' '+ri+' 0 1 0 60 '+(60-ri)+'Z'}
function bolt(x,y,s,fill,rot,ex){return'<polygon transform="translate('+f2(x)+' '+f2(y)+') rotate('+(rot||0)+') scale('+s+')" points="0.2,-1 -0.55,0.15 -0.05,0.15 -0.25,1 0.6,-0.2 0.05,-0.2" fill="'+fill+'" '+(ex||'')+'/>'}
function around(n,r,fn,off){off=off==null?-Math.PI/2:off;var s='';for(var i=0;i<n;i++){var a=off+i*T/n,p=P(a,r);s+=fn(p[0],p[1],a,i)}return s}
function wave(r,amp,k,ph,pts){pts=pts||180;var d='';for(var i=0;i<=pts;i++){var a=i*T/pts,rr=r+amp*Math.sin(k*a+ph),p=P(a,rr);d+=(i?'L':'M')+f2(p[0])+' '+f2(p[1])}return d+'Z'}

function Builder(u){this.u=u;this.defs=[];this.seen={}}
Builder.prototype.lin=function(n,stops,d){d=d||[0,0,1,1];var id=this.u+n;this.defs.push('<linearGradient id="'+id+'" x1="'+d[0]+'" y1="'+d[1]+'" x2="'+d[2]+'" y2="'+d[3]+'">'+stops.map(function(s){return'<stop offset="'+s[0]+'" stop-color="'+s[1]+'"/>'}).join('')+'</linearGradient>');return'url(#'+id+')'};
Builder.prototype.rad=function(n,stops,fx,fy){var id=this.u+n;if(!this.seen[id]){this.seen[id]=1;this.defs.push('<radialGradient id="'+id+'" cx=".5" cy=".5" r=".55" fx="'+(fx||.35)+'" fy="'+(fy||.3)+'">'+stops.map(function(s){return'<stop offset="'+s[0]+'" stop-color="'+s[1]+'"/>'}).join('')+'</radialGradient>')}return'url(#'+id+')'};
Builder.prototype.glow=function(n,sd){var id=this.u+n;this.defs.push('<filter id="'+id+'" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="'+sd+'"/></filter>');return'url(#'+id+')'};
Builder.prototype.sph=function(x,y,r,c){var g=this.rad('s'+c.replace('#',''),[[0,shade(c,.75)],[.5,c],[1,shade(c,-.5)]]);return dot(x,y,r,g)};
Builder.prototype.clip=function(n,d){var id=this.u+n;this.defs.push('<clipPath id="'+id+'"><path d="'+d+'" clip-rule="evenodd"/></clipPath>');return'url(#'+id+')'};

var F=[];
function add(g,n,d,fn){F.push({g:g,n:n,d:d,fn:fn})}
var METAL={bronze:['#8a5a33','#e8b283','#a8693a','#5e3a1e','#d09a68','#8a5a33'],silver:['#9aa3b0','#f7f9fc','#b6bec9','#6b7482','#e9eef5','#9aa3b0'],gold:['#a6761b','#fff0a8','#d9a62e','#7a5210','#ffd86b','#a6761b'],plat:['#8fa3bd','#f7fcff','#b9cde0','#6f87a3','#eaf6ff','#8fa3bd']};
function metal(cols,r,w){r=r||39;w=w||8;return conic(cols,r,w,100)+ring(r-w/2,.6,'rgba(0,0,0,.35)')+ring(r+w/2,.6,'rgba(255,255,255,.55)')}

/* ===== ПИКСЕЛИ И 3D ===== */
add('px','Кубическое кольцо','Объёмные кубики, как в воксельной игре',function(b){var a=[];var n=24;for(var i=0;i<n;i++){var an=-Math.PI/2+i*T/n,p=P(an,41.5);a.push([p[0],p[1],i])}a.sort(function(m,k){return m[1]-k[1]});return a.map(function(q){var c=q[2]%2?['#8aeaff','#2aa6e0','#136fb0']:['#bff5ff','#4cc0f2','#1f86cc'];return cube(q[0],q[1]+.5,5.4,c)}).join('')});
add('px','Шарики кольцом','Блестящие шарики встык, как бусины',function(b){var cols=['#ff8fb1','#ffd36b','#8fe3a8','#7fc8ff','#c3a3ff'];return around(18,41,function(x,y,a,i){return b.sph(x,y,5.1,cols[i%5])})});
add('px','Радужные шарики','Два ряда шариков по всему спектру',function(b){return around(26,47,function(x,y,a,i){return b.sph(x,y,3.5,hsl(i*360/26,85,58))})+around(20,39.5,function(x,y,a,i){return b.sph(x,y,3.6,hsl(i*360/20+20,85,60))},-Math.PI/2+.15)});
add('px','8 бит','Пиксельное кольцо зелёной игровой гаммы',function(b){var s='<g shape-rendering="crispEdges">';for(var gx=-12;gx<12;gx++)for(var gy=-12;gy<12;gy++){var x=60+gx*4+2,y=60+gy*4+2,d=Math.hypot(x-60,y-60);if(d>35.5&&d<45.5){s+='<rect x="'+(60+gx*4)+'" y="'+(60+gy*4)+'" width="4" height="4" fill="'+((gx+gy)%2?'#37b24d':'#69db7c')+'"/>'}}return s+'</g>'});
add('px','Пиксельная радуга','Квадраты 4×4 по кругу, цвет по углу',function(b){var s='<g shape-rendering="crispEdges">';for(var gx=-13;gx<13;gx++)for(var gy=-13;gy<13;gy++){var x=60+gx*4+2,y=60+gy*4+2,d=Math.hypot(x-60,y-60);if(d>35.5&&d<47.5){var an=Math.atan2(y-60,x-60);s+='<rect x="'+(60+gx*4)+'" y="'+(60+gy*4)+'" width="4" height="4" fill="'+hsl((an+Math.PI)*180/Math.PI,80,((gx+gy)%2)?55:62)+'"/>'}}return'<g class="spin">'+s+'</g></g>'.replace('</g></g>','</g>')});
add('px','Ледяные кубы','Прозрачные голубые кубики и искры',function(b){var a=[],n=22;for(var i=0;i<n;i++){var an=-Math.PI/2+i*T/n,p=P(an,41.5);a.push([p[0],p[1],i])}a.sort(function(m,k){return m[1]-k[1]});var t=a.map(function(q){var c=q[2]%3?['#f2fdff','#a9e6fb','#6ec7ef']:['#ffffff','#d1f3ff','#8fd8f5'];return cube(q[0],q[1]+.5,5.2,c)}).join('');return[t,spark(26,24,4,'#fff','class="tw"')+spark(96,34,3.4,'#fff','class="tw2"')+spark(88,92,3.8,'#dffaff','class="tw"')]});

function svgFor(item,idx){

}
var sel={};try{sel=JSON.parse(localStorage.getItem('fr105')||'{}')}catch(e){}
var cur='all',grid=document.getElementById('grid');
function save(){try{localStorage.setItem('fr105',JSON.stringify(sel))}catch(e){}}
function build(){
  grid.innerHTML=F.map(function(it,i){return'<button type="button" class="card" data-g="'+it.g+'" data-i="'+i+'" aria-pressed="'+(!!sel[i+1])+'" aria-label="Рамка '+(i+1)+', '+it.n+'"><span class="no">'+(i+1)+'</span><span class="star" aria-hidden="true">★</span><span class="stage">'+svgFor(it,i)+'</span><span class="nm">'+it.n+'</span><span class="ds">'+it.d+'</span></button>'}).join('');
  var ch=document.getElementById('chips');
  ch.innerHTML=GROUPS.map(function(g){var n=g[0]==='all'?F.length:F.filter(function(x){return x.g===g[0]}).length;return'<button type="button" class="chip" data-g="'+g[0]+'" aria-pressed="'+(g[0]===cur)+'">'+g[1]+'<small>'+n+'</small></button>'}).join('');
}
function filt(){[].forEach.call(grid.children,function(c){c.hidden=!(cur==='all'||c.getAttribute('data-g')===cur)});[].forEach.call(document.querySelectorAll('#chips .chip'),function(c){c.setAttribute('aria-pressed',String(c.getAttribute('data-g')===cur))})}
function pickUi(){var ids=Object.keys(sel).map(Number).sort(function(a,b){return a-b});var l=document.getElementById('plist');l.innerHTML='<b>Выбрано: '+ids.length+'</b>'+(ids.length?' · '+ids.map(function(i){return'№'+i+' '+F[i-1].n}).join(', '):' · отметьте понравившиеся звёздочкой');document.getElementById('cpy').disabled=document.getElementById('clr').disabled=!ids.length}
build();filt();pickUi();
grid.addEventListener('click',function(e){var c=e.target.closest('.card');if(!c)return;var n=+c.getAttribute('data-i')+1;if(sel[n]){delete sel[n]}else{sel[n]=1}c.setAttribute('aria-pressed',String(!!sel[n]));save();pickUi()});
document.getElementById('chips').addEventListener('click',function(e){var c=e.target.closest('.chip');if(!c)return;cur=c.getAttribute('data-g');filt()});
function seg(id,fn){var el=document.getElementById(id);el.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;[].forEach.call(el.children,function(x){x.setAttribute('aria-pressed',String(x===b))});fn(b.getAttribute('data-v'))})}
seg('bgseg',function(v){grid.setAttribute('data-bg',v)});
seg('szseg',function(v){grid.style.setProperty('--sz',v+'px')});
seg('anseg',function(v){document.documentElement.classList.toggle('noanim',v==='off')});
function msg(t){var el=document.getElementById('toast');el.textContent=t;setTimeout(function(){el.textContent=''},2600)}
document.getElementById('clr').addEventListener('click',function(){sel={};save();[].forEach.call(grid.children,function(c){c.setAttribute('aria-pressed','false')});pickUi()});
document.getElementById('cpy').addEventListener('click',function(){var ids=Object.keys(sel).map(Number).sort(function(a,b){return a-b});var t='Выбранные рамки: '+ids.map(function(i){return'№'+i+' '+F[i-1].n}).join(', ');function fb(){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();msg(ok?'Список скопирован':'Выделите и скопируйте вручную')}try{navigator.clipboard.writeText(t).then(function(){msg('Список скопирован')},fb)}catch(e){fb()}});
})();
</script>
