<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><defs><linearGradient id="u63_cs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a1f7a"/><stop offset="1" stop-color="#0d1236"/></linearGradient><radialGradient id="u63_pl" cx=".5" cy=".5" r=".55" fx="0.35" fy="0.3"><stop offset="0" stop-color="#ffc78a"/><stop offset="1" stop-color="#c4622a"/></radialGradient></defs><style>svg .spin,svg .spinr,svg .pulse,svg .tw,svg .flick,svg .wob{transform-box:view-box;transform-origin:50% 50%}.spin{animation:spin 14s linear infinite}.spinr{animation:spin 18s linear infinite reverse}.spin2{animation:spin 6s linear infinite}.pulse{animation:pulse 2.4s ease-in-out infinite}.tw{animation:tw 2.2s ease-in-out infinite}.tw2{animation:tw 2.2s ease-in-out -1.1s infinite}.flick{animation:flick .9s ease-in-out infinite alternate}.flick2{animation:flick .7s ease-in-out -.3s infinite alternate}.wob{animation:wob 5s ease-in-out infinite alternate}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}@keyframes flick{from{opacity:.55}to{opacity:1}}@keyframes wob{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g transform="translate(92 28)"><circle r="6.5" fill="url(#u63_pl)"/><ellipse rx="11" ry="3" fill="none" stroke="#ffe3b8" stroke-width="1.2" transform="rotate(-22)"/></g></svg>