<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><style>svg .spin,svg .spinr,svg .pulse,svg .tw,svg .flick,svg .wob{transform-box:view-box;transform-origin:50% 50%}.spin{animation:spin 14s linear infinite}.spinr{animation:spin 18s linear infinite reverse}.spin2{animation:spin 6s linear infinite}.pulse{animation:pulse 2.4s ease-in-out infinite}.tw{animation:tw 2.2s ease-in-out infinite}.tw2{animation:tw 2.2s ease-in-out -1.1s infinite}.flick{animation:flick .9s ease-in-out infinite alternate}.flick2{animation:flick .7s ease-in-out -.3s infinite alternate}.wob{animation:wob 5s ease-in-out infinite alternate}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}@keyframes flick{from{opacity:.55}to{opacity:1}}@keyframes wob{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><circle cx="60" cy="60" r="39" fill="none" stroke="#ffc2d6" stroke-width="2" /><g class=""><path transform="translate(60 14) rotate(0) scale(4.6)" d="M0 .55C-1 -.1 -.7 -.9 0 -.4C.7 -.9 1 -.1 0 .55Z" fill="#ff6f9c" /></g><g class="pulse"><path transform="translate(84.9 21.3) rotate(32.72727272727273) scale(5.1)" d="M0 .55C-1 -.1 -.7 -.9 0 -.4C.7 -.9 1 -.1 0 .55Z" fill="#ff8fb1" /></g><g class=""><path transform="translate(101.8 40.9) rotate(65.45454545454545) scale(5.6)" d="M0 .55C-1 -.1 -.7 -.9 0 -.4C.7 -.9 1 -.1 0 .55Z" fill="#ff4d82" /></g><g class="pulse"><path transform="translate(105.5 66.5) rotate(98.18181818181817) scale(4.6)" d="M0 .55C-1 -.1 -.7 -.9 0 -.4C.7 -.9 1 -.1 0 .55Z" fill="#ffb3c9" /></g><g class=""><path transform="translate(94.8 90.1) rotate(130.9090909090909) scale(5.1)" d="M0 .55C-1 -.1 -.7 -.9 0 -.4C.7 -.9 1 -.1 0 .55Z" fill="#ff6f9c" /></g><g class="pulse"><path transform="translate(73 104.1) rotate(163.63636363636363) scale(5.6)" d="M0 .55C-1 -.1 -.7 -.9