<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><defs><filter id="u80_g" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.2"/></filter></defs><style>svg .spin,svg .spinr,svg .pulse,svg .tw,svg .flick,svg .wob{transform-box:view-box;transform-origin:50% 50%}.spin{animation:spin 14s linear infinite}.spinr{animation:spin 18s linear infinite reverse}.spin2{animation:spin 6s linear infinite}.pulse{animation:pulse 2.4s ease-in-out infinite}.tw{animation:tw 2.2s ease-in-out infinite}.tw2{animation:tw 2.2s ease-in-out -1.1s infinite}.flick{animation:flick .9s ease-in-out infinite alternate}.flick2{animation:flick .7s ease-in-out -.3s infinite alternate}.wob{animation:wob 5s ease-in-out infinite alternate}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}@keyframes flick{from{opacity:.55}to{opacity:1}}@keyframes wob{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="spin"><path d="M98 60A38 38 0 0 1 73.8 95.4M44.2 94.6A38 38 0 0 1 22.5 54M35.2 31.2A38 38 0 0 1 84.1 30.6" stroke="#26e6ff" stroke-width="2.4" fill="none" filter="url(#u80_g)"/></g><g class="spinr"><circle cx="60" cy="60" r="43" fill="none" stroke="#4cc0ff" stroke-width="1.6" stroke-dasharray="9 3 2 3"/></g><g class="spin"><circle cx="60" cy="60" r="48" fill="none" stroke="#a8f0ff" stroke-width="1" stroke-dasharray="1 3"/></g></svg>