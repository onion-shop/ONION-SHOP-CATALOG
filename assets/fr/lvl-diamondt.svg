<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><style>svg .spin,svg .spinr,svg .pulse,svg .tw,svg .flick,svg .wob{transform-box:view-box;transform-origin:50% 50%}.spin{animation:spin 14s linear infinite}.spinr{animation:spin 18s linear infinite reverse}.spin2{animation:spin 6s linear infinite}.pulse{animation:pulse 2.4s ease-in-out infinite}.tw{animation:tw 2.2s ease-in-out infinite}.tw2{animation:tw 2.2s ease-in-out -1.1s infinite}.flick{animation:flick .9s ease-in-out infinite alternate}.flick2{animation:flick .7s ease-in-out -.3s infinite alternate}.wob{animation:wob 5s ease-in-out infinite alternate}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}@keyframes flick{from{opacity:.55}to{opacity:1}}@keyframes wob{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path d="M24 17.4Q24 22 28.6 22Q24 22 24 26.6Q24 22 19.4 22Q24 22 24 17.4Z" fill="#fff" class="tw"/><path d="M98 36.6Q98 40 101.4 40Q98 40 98 43.4Q98 40 94.6 40Q98 40 98 36.6Z" fill="#fff" class="tw2"/><path d="M90 91.6Q90 96 94.4 96Q90 96 90 100.4Q90 96 85.6 96Q90 96 90 91.6Z" fill="#e8fbff" class="tw"/></svg>