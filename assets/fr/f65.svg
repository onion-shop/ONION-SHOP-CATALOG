<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><style>svg .spin,svg .spinr,svg .pulse,svg .tw,svg .flick,svg .wob{transform-box:view-box;transform-origin:50% 50%}.spin{animation:spin 14s linear infinite}.spinr{animation:spin 18s linear infinite reverse}.spin2{animation:spin 6s linear infinite}.pulse{animation:pulse 2.4s ease-in-out infinite}.tw{animation:tw 2.2s ease-in-out infinite}.tw2{animation:tw 2.2s ease-in-out -1.1s infinite}.flick{animation:flick .9s ease-in-out infinite alternate}.flick2{animation:flick .7s ease-in-out -.3s infinite alternate}.wob{animation:wob 5s ease-in-out infinite alternate}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}@keyframes tw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}@keyframes flick{from{opacity:.55}to{opacity:1}}@keyframes wob{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="spin"><polygon points="51.4,16.8 68.6,16.8 60,5" fill="#ffd34d"/><polygon points="68.6,16.8 84.4,23.4 79.5,12.9" fill="#ffb400"/><polygon points="84.4,23.4 96.6,35.6 98.9,21.1" fill="#ffd34d"/><polygon points="96.6,35.6 103.2,51.4 107.1,40.5" fill="#ffb400"/><polygon points="103.2,51.4 103.2,68.6 115,60" fill="#ffd34d"/><polygon points="103.2,68.6 96.6,84.4 107.1,79.5" fill="#ffb400"/><polygon points="96.6,84.4 84.4,96.6 98.9,98.9" fill="#ffd34d"/><polygon points="84.4,96.6 68.6,103.2 79.5,107.1" fill="#ffb400"/><polygon points="68.6,103.2 51.4,103.2 60,115" fill="#ffd34d"/><polygon points="51.4,103.2 35.6,96.6 40.5,107.1" fill="#ffb400"/><polygon points="35.6,96.6 23.4,84.4 21.1,98.9" fill="#ffd34d"/><polygon points="23.4,84.4 16.8,68.6 12.9,79.5" fill="#ffb400"/><polygon points="16.8,68.6 16.8,51.4 5,60" fill="#ffd34d"/><polygon points="16.8,51.4 23.4,35.6 12.9,40.5" fill="#ffb400"/><polygon points="23.4,35.6 35.6,23.4 21.1,21.1" fill="#ffd34d"/><polygon points="35.6,23.4 51.4,16.8 40.5,12.9" fill="#ffb400"/></g><circle cx="60" cy="60" r="39.5" fill="none" stroke="#ffc21a" stroke-width="8" /><circle cx="60" cy="60" r="39.5" fill="none" stroke="#fff1a8" stroke-width="2" /></svg>